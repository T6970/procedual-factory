<script>

let n=0;{for(let x=Math.max(4,id-4);x<=id+4&&!n;x++)if(!raw(x)&&own(x)==id)n=x;
if(n){if(inp[n]){delete inp[n];if(!Object.keys(inp).length)inp[1]=1}const amt=Object.values(d.output)[0];d.output={[n]:amt};if(c[n]){const v=c[n];delete c[n];c[n+1]=v}}}

else{const inp=id==1?{}:{[RI(1,(3+id))]:RI(2,2+Math.floor(id/4))};d={input:inp,output:id==1?20:Math.round(30*id+20*R(3)),kick:id==1?0:Math.floor(R(4)*(5+id)),size:SZ(5),cost:cost((3+id),1.2)}}}

RD--;if(!RD)RV.clear();return n}
{const f=fr(b);if(at(f[0],f[1])===src)return 0}const q=Math.min(a,d.cap-tot(b));if(q<=0)return 0;b.inv[it]=(b.inv[it]||0)+q;const Q=b.q||(b.q=[]),L=Q[Q.length-1];if(L&&L.it==it&&L.p<.08)L.a+=q;else Q.push({it,a:q,p:0});return q}

function push(b,budget,noRouter,tgt){const f=tgt||fr(b),o=tgt?tgt:at(f[0],f[1]);if(!o||(noRouter&&isRouter(o)))return;

let C=[],PW={P:0,U:0};

for(const b of blocks){const d=b.d,t=d.t;

else if(t=='bridge'){const dx=[0,1,0,-1][b.rot],dy=[-1,0,1,0][b.rot];let tg=null;for(let i=1;i<=d.range+1;i++){const o=at(b.x+dx*i,b.y+dy*i);if(o&&o!==b&&o.d.t=='bridge'){tg=o;break}if(o&&i==1)break}

// drawing

if(v=='brass'){f.frequency.setValueAtTime(500,s);f.frequency.linearRampToValueAtTime(3200,s+.09);f.frequency.linearRampToValueAtTime(1400,s+d);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(e.g,s+.04);g.gain.setValueAtTime(e.g*.85,s+d*.8);g.gain.linearRampToValueAtTime(0,s+d+.08)}
else if(v=='str'){f.frequency.value=2000;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(e.g,s+.35);g.gain.setValueAtTime(e.g,s+Math.max(.36,d-.1));g.gain.linearRampToValueAtTime(0,s+d+.3)}
else{f.frequency.setValueAtTime(2600,s);f.frequency.exponentialRampToValueAtTime(600,s+d);g.gain.setValueAtTime(e.g,s);g.gain.exponentialRampToValueAtTime(.001,s+d)}}
else if(e.v=='timp'||e.v=='boom'){const o=ctx.createOscillator();o.frequency.setValueAtTime(fq(e.m)*(e.v=='timp'?1.6:2),s);o.frequency.exponentialRampToValueAtTime(fq(e.m),s+.12);o.connect(g);g.gain.setValueAtTime(e.g||1,s);g.gain.exponentialRampToValueAtTime(.001,s+(e.v=='timp'?.7:1.4));o.start(s);o.stop(s+1.5)}
else if(e.v=='cym'){const n=ctx.createBufferSource(),f=ctx.createBiquadFilter();n.buffer=nb;f.type='highpass';f.frequency.value=5000;n.connect(f);f.connect(g);g.gain.setValueAtTime(.3,s);g.gain.exponentialRampToValueAtTime(.001,s+d);n.start(s);n.stop(s+Math.min(1.5,d)+.1)}
else if(e.v=='tom'){const o=ctx.createOscillator();o.frequency.setValueAtTime(fq(e.m+12),s);o.frequency.exponentialRampToValueAtTime(fq(e.m),s+.2);g.gain.setValueAtTime(.9,s);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.connect(g);o.start(s);o.stop(s+.27)}

g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(e.g,s+Math.min(.05,d/4));g.gain.linearRampToValueAtTime(e.g*.6,s+d*.6);g.gain.linearRampToValueAtTime(0,s+d);o.connect(g);g.connect(m);o.start(s);o.stop(s+d+.05)}
const end=t0+len*sp;Mu.timer=setTimeout(()=>{if(Mu.on)playPiece(end)},Math.max(500,(end-ctx.currentTime-4)*1000));return end}
function musicStart(){if(!Mu.on)return;if(!Mu.ctx)Mu.ctx=new (window.AudioContext||window.webkitAudioContext)();Mu.ctx.resume();if(Mu.seed===seed&&Mu.timer)return;Mu.force=false;musicStop();Mu.seed=seed;Mu.piece=0;playPiece(Mu.ctx.currentTime+.3)}

let boss={n:0,t:0,done:false,on:false};

const nb4=(x,y)=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
function wouldChain(p){const seen=new Set(),st=[],over=new Set(p.over);const go=(x,y)=>{for(const[a,b]of nb4(x,y)){const o=at(a,b);if(o&&isRouter(o)&&!over.has(o)&&!seen.has(o)){seen.add(o);st.push(o)}}};go(p.x,p.y);while(st.length){const a=st.pop();go(a.x,a.y)}return seen.size+1>=5}
